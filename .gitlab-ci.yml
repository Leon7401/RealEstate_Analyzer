# GitLab CI/CD — 不動産投資判定システム
# 使い方:
# 1. このリポジトリを GitLab に mirror / push
# 2. Settings → CI/CD → Variables に以下を登録
#    - RENDER_DEPLOY_HOOK (Render Dashboard の Deploy Hook URL)
#    - 任意: REINFOLIB_API_KEY 等は Render 側 Environment で管理推奨
# 3. main への push で Render へ自動デプロイ

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  APP_DIR: "RealEstate/re_agent_team"

cache:
  paths:
    - .cache/pip

.python:
  image: python:3.11-slim
  before_script:
    - cd "$APP_DIR"
    - pip install -r requirements.txt

test:
  extends: .python
  stage: test
  script:
    - python -c "from contracts import GRADE_PALETTE; from services.geo_quality import GeoQualityService; print('ok', GRADE_PALETTE['S'])"
    - python -c "from web.app import app; print('routes', len(app.routes))"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Render Deploy Hook を叩いて本番反映
deploy_render:
  stage: deploy
  image: curlimages/curl:8.5.0
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK" ]; then
        echo "RENDER_DEPLOY_HOOK が未設定です。GitLab CI Variables に追加してください。"
        exit 1
      fi
      curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
      echo "Render deploy triggered"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success

# 任意: GitLab Container Registry にイメージを積む
build_image:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      cat > Dockerfile.ci <<'EOF'
      FROM python:3.11-slim
      WORKDIR /app
      COPY RealEstate/re_agent_team/requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY RealEstate/re_agent_team/ .
      ENV WEB_HOST=0.0.0.0 WEB_PORT=8080
      EXPOSE 8080
      CMD ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]
      EOF
    - docker build -f Dockerfile.ci -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
